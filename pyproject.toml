[project]
name = "cab"
version = "3.0.7"
description = "Socle CAB"
requires-python = ">=3.12"
dependencies = [
    "Django==6.1.3",
    "django-ninja==1.7.1",
    "uvicorn==0.54.0",
    "mcp==2.3.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "asgiref==3.12.1",
    "sqlparse==0.6.0",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
]

[build-system]
requires = [
    "setuptools",
    # Dernières versions stables vérifiées au début de chaque campagne,
    # puis figées pendant toute sa durée.
    "Cython==3.3.0",
    "Nuitka==4.3.1",
]
build-backend = "setuptools.build_meta"
